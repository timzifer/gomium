name: CEF review

# An agent review of pull requests that touch the cgo binding, with the
# prompt of the unsafe audit (.github/claude-review/cef-audit.md). It adds
# to refcheck, the refdebug ledger and the nightly debug-runtime run - it is
# not deterministic and does not gate the merge.
#
# Needs a repository secret: ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN
# (from `claude setup-token`). Without one the job only leaves a notice.
# Pull requests from forks get no secrets and are skipped. To review again,
# re-run the job.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "internal/cef/**"
      - "internal/cefshim/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review (internal/cef)
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for credentials
        id: creds
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$API_KEY" ] || [ -n "$OAUTH_TOKEN" ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::CEF review skipped: set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a repository secret"
          fi

      - name: Build prompt
        if: steps.creds.outputs.present == 'true'
        id: prompt
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "text<<PROMPT_END"
            echo "REPO: $GITHUB_REPOSITORY"
            echo "PR NUMBER: $PR"
            echo "The pull request is checked out in the working directory."
            echo
            cat .github/claude-review/cef-audit.md
            echo "PROMPT_END"
          } >>"$GITHUB_OUTPUT"

      - name: Review
        if: steps.creds.outputs.present == 'true'
        # v1.0.283
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
